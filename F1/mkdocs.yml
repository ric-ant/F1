site_name: F1 Lap Comparison Dashboard
site_description: Dashboard HTML interativo de comparativo de tempos de volta da Fórmula 1
site_author: Ricardo Antonello

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: red
      accent: red

nav:
  - Início: index.md
  - Guia de Uso: guia-de-uso.md
  - Arquitetura: arquitetura.md
  - Referência da API: api-reference.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables
